name: coatl-dev-pr-create
description: GitHub Action to create Pull Request using gh.
author: cesarcoatl

inputs:
  auto-merge:
    description: >-
      Automatically merge only after necessary requirements are met.
    required: false
    default: 'yes'
  base-branch:
    description: >-
      Base branch for the pull request. Defaults to the repository default branch when omitted.
    required: false
    default: ''
  body:
    description: >-
      Body for the pull request.
    required: false
    default: ''
  body-file:
    description: >-
      Read body text from file.
    required: false
    default: ''
  delete-branch:
    description: >-
      Delete the local and remote branch after merge.
    required: false
    default: 'no'
  gh-token:
    description: >-
      GitHub token.
    required: true
  title:
    description: >-
      Title for the pull request.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create Pull Request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        INPUT_AUTO_MERGE: ${{ inputs.auto-merge }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_BODY_FILE: ${{ inputs.body-file }}
        INPUT_DELETE_BRANCH: ${{ inputs.delete-branch }}
        INPUT_TITLE: ${{ inputs.title }}
      run: |
        ${{ github.action_path }}/action.sh
