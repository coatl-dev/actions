name: coatl-dev-gpg-import
description: GitHub Action to import GPG private key.
author: cesarcoatl

inputs:
  config-git:
    description: >-
      Whether to configure Git to sign commits with the information obtained
      from GPG.
    required: false
    default: 'yes'

  passphrase:
    description: GPG private key passphrase.
    required: true

  private-key:
    description: >-
      GPG private key exported as an ASCII-armored version.
    required: true

outputs:
  git-user-email:
    description: Email address used for setting up Git identity.
    value: ${{ steps.git-user.outputs.email }}
  git-user-name:
    description: Name used for setting up Git identity.
    value: ${{ steps.git-user.outputs.name }}
  gpg-key-id:
    description: The long form of the GPG key ID.
    value: ${{ steps.import-gpg.outputs.keyid }}

runs:
  using: composite
  steps:
    - name: Import GPG key and prime passphrase
      id: import-gpg
      shell: bash
      env:
        INPUT_PASSPHRASE: ${{ inputs.passphrase }}
        INPUT_PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail

        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT

        printf '%s\n' "$INPUT_PRIVATE_KEY" |
          gpg --batch --no-tty --import

        keyid="$(
          gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "sec" && !found {
              print $5
              found = 1
            }'
        )"

        if [[ -z "$keyid" ]]; then
          echo "::error::No secret GPG key was found after importing the private key."
          exit 1
        fi

        echo "keyid=$keyid" >> "$GITHUB_OUTPUT"

        printf '%s\n' 'hello world' > "$tmpdir/temp.txt"

        gpg \
          --batch \
          --no-tty \
          --yes \
          --pinentry-mode loopback \
          --passphrase "$INPUT_PASSPHRASE" \
          --local-user "$keyid" \
          --detach-sign \
          --output /dev/null \
          "$tmpdir/temp.txt"

    - name: Get real name and email address
      id: git-user
      shell: bash
      run: |
        set -euo pipefail

        uid="$(
          gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "uid" && !found {
              print $10
              found = 1
            }'
        )"

        if [[ -z "$uid" ]]; then
          echo "::error::Unable to determine the GPG user identity."
          exit 1
        fi

        name="${uid%% <*}"
        email="${uid##*<}"
        email="${email%>}"

        if [[ -z "$name" || -z "$email" ]]; then
          echo "::error::Unable to parse the GPG user identity."
          exit 1
        fi

        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "email=$email" >> "$GITHUB_OUTPUT"

    - name: Configure Git user
      if: ${{ inputs.config-git == 'yes' }}
      shell: bash
      env:
        GIT_USER_EMAIL: ${{ steps.git-user.outputs.email }}
        GIT_USER_NAME: ${{ steps.git-user.outputs.name }}
      run: |
        set -euo pipefail

        git config --local user.email "$GIT_USER_EMAIL"
        git config --local user.name "$GIT_USER_NAME"

    - name: Tell Git about the signing key
      if: ${{ inputs.config-git == 'yes' }}
      shell: bash
      env:
        GPG_KEY_ID: ${{ steps.import-gpg.outputs.keyid }}
      run: |
        set -euo pipefail

        git config --local user.signingkey "$GPG_KEY_ID"
        git config --local commit.gpgsign true
