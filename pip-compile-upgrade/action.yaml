name: coatl-dev-pip-compile
description: Run pip-compile to upgrade your Python 2/3 requirements.
author: cesarcoatl

inputs:
  path:
    description: >-
      The location of the requirement file(s).
    required: true
  python-version:
    description: >-
      Python version to use for installing pip-tools.
    required: false
    default: '3.13'
  use-config:
    description: >-
      Whether to read configuration from TOML file.
    required: false
    default: 'no'
  config-file:
    description: >-
      The location of the configuration file for pip-compile.
    required: false
    default: '.pip-tools.toml'
  extra-args:
    description: >-
      Extra arguments to pass to pip-compile.
    required: false
    default: ''
  working-directory:
    description: >-
      The working directory to run the action in.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker build \
          --build-arg VERSION=${{ inputs.python-version }} \
          --file ${{ github.action_path }}/Dockerfile \
          --tag coatl-pip-compile:${{ inputs.python-version }} \
          ${{ github.action_path }}

    - shell: bash
      run: |
        docker run --rm \
          --env "INPUT_PATH=${{ inputs.path }}" \
          --env "INPUT_USE_CONFIG=${{ inputs.use-config }}" \
          --env "INPUT_CONFIG_FILE=${{ inputs.config-file }}" \
          --env "INPUT_EXTRA_ARGS=${{ inputs.extra-args }}" \
          --env "INPUT_WORKING_DIRECTORY=${{ inputs.working-directory }}" \
          --volume ${{ github.workspace }}://github/workspace \
          coatl-pip-compile:${{ inputs.python-version }}
