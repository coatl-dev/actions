name: test-uv-pip-compile-upgrade

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test-uv-pip-compile-upgrade.yaml
      - uv-pip-compile-upgrade/**
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    env:
      REQUIREMENTS_PATH: uv-pip-compile-upgrade/test/requirements

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: uv-pip-compile-upgrade
        uses: ./uv-pip-compile-upgrade
        with:
          path: ${{ env.REQUIREMENTS_PATH }}

      - name: Detect changes
        id: git-diff
        uses: ./simple-git-diff
        with:
          path: ${{ env.REQUIREMENTS_PATH }}

      - name: Show output
        run: |
          echo "Changes were detected: ${STEPS_GIT_DIFF_OUTPUTS_DIFF}"
        env:
          STEPS_GIT_DIFF_OUTPUTS_DIFF: ${{ steps.git-diff.outputs.diff }}
