name: test-pypi-upload

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test-pypi-upload.yaml
      - pypi-upload/**
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coatl-dev/actions repo
        uses: actions/checkout@v6


      - name: Checkout test repository
        uses: actions/checkout@v6
        with:
          repository: ignition-devs/incendium
          path: incendium

      - name: pypi-upload-2.7
        uses: ./pypi-upload
        with:
          dry-run: true
          working-directory: incendium/incendium

      - name: pypi-upload-3.12
        uses: ./pypi-upload
        with:
          dry-run: true
          working-directory: incendium/incendium-stubs
          python-version: '3.12'
