name: test-pip-compile-upgrade

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test-pip-compile-upgrade.yaml
      - pip-compile-upgrade/**
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - path: pip-compile-upgrade/test/2.7/requirements
            working-directory: ${{ github.workspace }}
          - path: tools.txt
            working-directory: pip-compile-upgrade/test/2.7/requirements/tools

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: pip-compile-upgrade
        uses: ./pip-compile-upgrade
        with:
          path: ${{ matrix.path }}
          extra-args: '--dry-run --reuse-hashes --verbose'
          working-directory: ${{ matrix.working-directory }}
