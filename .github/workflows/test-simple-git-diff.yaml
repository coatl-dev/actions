name: test-simple-git-diff

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test-simple-git-diff.yaml
      - simple-git-diff/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-true:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Modify file in repo
        run: |
          echo "New line" >> README.md

      - name: Detect changes
        id: git-diff
        uses: ./simple-git-diff
        with:
          path: 'README.md'

      - name: Test true
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        run: |
          echo "Changes were detected."

  test-false:
    runs-on: ubuntu-slim
    needs: test-true
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect changes
        id: git-diff
        uses: ./simple-git-diff

      - name: Test false
        if: ${{ steps.git-diff.outputs.diff != 'true' }}
        run: |
          echo "Changes were not detected."
