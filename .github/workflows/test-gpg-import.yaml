name: test-gpg-import

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test-gpg-import.yaml
      - gpg-import/**
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Import GPG
        uses: ./gpg-import
        id: gpg-import
        with:
          passphrase: ${{ secrets.COATL_BOT_GPG_PASSPHRASE }}
          private-key: ${{ secrets.COATL_BOT_GPG_PRIVATE_KEY }}

      - name: Show Output
        run: |
          echo "git user.email: ${STEPS_GPG_IMPORT_OUTPUTS_GIT_USER_EMAIL}"
          echo "git user.name: ${STEPS_GPG_IMPORT_OUTPUTS_GIT_USER_NAME}"
        env:
          STEPS_GPG_IMPORT_OUTPUTS_GIT_USER_EMAIL: ${{ steps.gpg-import.outputs.git-user-email }}
          STEPS_GPG_IMPORT_OUTPUTS_GIT_USER_NAME: ${{ steps.gpg-import.outputs.git-user-name }}
