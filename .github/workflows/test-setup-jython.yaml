name: test-setup-jython

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test-setup-jython.yaml
      - setup-jython/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Jython
        id: jy
        uses: $/setup-jython

      - name: Test action output
        run: |
          echo "JYTHON_VERSION=${STEPS_JY_OUTPUTS_JYTHON_VERSION}"
          echo "JYTHON_BINARY=${STEPS_JY_OUTPUTS_JYTHON_PATH}"
          echo "JAVA_DISTRIBUTION=${STEPS_JY_OUTPUTS_JAVA_DISTRIBUTION}"
          echo "JAVA_PATH=${STEPS_JY_OUTPUTS_JAVA_PATH}"
          echo "JAVA_VERSION=${STEPS_JY_OUTPUTS_JAVA_VERSION}"
        env:
          STEPS_JY_OUTPUTS_JYTHON_VERSION: ${{ steps.jy.outputs.jython-version }}
          STEPS_JY_OUTPUTS_JYTHON_PATH: ${{ steps.jy.outputs.jython-path }}
          STEPS_JY_OUTPUTS_JAVA_DISTRIBUTION: ${{ steps.jy.outputs.java-distribution }}
          STEPS_JY_OUTPUTS_JAVA_PATH: ${{ steps.jy.outputs.java-path }}
          STEPS_JY_OUTPUTS_JAVA_VERSION: ${{ steps.jy.outputs.java-version }}

      - name: Test
        run: |
          jython_date="$(jython -c 'from java.util import Calendar; now = Calendar.getInstance(); print now.get(Calendar.YEAR)')"
          bin_date="$(/bin/date +%Y)"

          if [ "$jython_date" == "$bin_date" ]; then
            echo "Dates are equal"
          else
            echo "Dates are not equal"
          fi
